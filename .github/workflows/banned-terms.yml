name: IP Protection - Banned Terms Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - '*.md'
      - '.github/**'

jobs:
  banned-terms:
    runs-on: ubuntu-latest
    name: Check for banned terminology

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for banned terms
        run: |
          # Check only for product-branded phrases, not internal directory references
          # Banned: "Gann Protocol", "Sara Sniper", "sniper entry", product names
          # Allowed: `lib/gann/` and `lib/strat/` in documentation (internal names)
          BANNED_PHRASES=(
            "Gann Protocol"
            "Sara Sniper"
            "sniper entr"
            "W\.D\. Gann"
          )

          VIOLATIONS=""
          for phrase in "${BANNED_PHRASES[@]}"; do
            if grep -r -E "$phrase" app/page.tsx README.md FEATURES.md 2>/dev/null; then
              VIOLATIONS="1"
              break
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Banned terminology detected:"
            echo "$VIOLATIONS"
            exit 1
          fi

          echo "✅ No banned terminology found"

      - name: Summary
        if: success()
        run: |
          echo "## IP Protection Check ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No prohibited proprietary terminology (Gann, Sara, Sniper, Strat) found in code." >> $GITHUB_STEP_SUMMARY
