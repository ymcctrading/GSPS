name: IP Protection - Banned Terms Gate

# Same reasoning as the Tests workflow: a PR opened through the GitHub App API
# can be created without Actions scheduling a `pull_request` run, so this gate
# also watches pushes. The path filter is repeated rather than shared because
# GitHub has no way to define it once for two events.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/check-banned-terms.mjs'
      - '*.md'
      - '.github/**'
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/check-banned-terms.mjs'
      - '*.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banned-terms:
    runs-on: ubuntu-latest
    name: Check for banned terminology

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Scans every source file that can render copy, not the three files the
      # previous version of this gate looked at. That narrow scope is why
      # "Gann fan angle proximity" and "Strat pattern armed" shipped to the
      # confluence checklist twice while this job stayed green: both strings
      # are built in lib/scoring/score.ts, which was never scanned.
      #
      # The script needs no dependencies, so there is no install step. The
      # matching half of this gate — the strings assembled at runtime — is
      # asserted by lib/__tests__/user-copy.test.ts in the Tests workflow.
      - name: Check for banned terms
        run: node scripts/check-banned-terms.mjs

      - name: Summary
        if: success()
        run: |
          echo "## IP Protection Check ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No prohibited proprietary terminology found in user-facing text." >> $GITHUB_STEP_SUMMARY
