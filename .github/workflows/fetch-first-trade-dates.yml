name: Fetch first-trade dates

# Runs scripts/fetch-first-trade-dates.mjs, which reads each LARGE_CAP_UNIVERSE
# stock's first-trade date from Wikidata and Yahoo Finance and keeps it only
# where the two agree (C-ASTRO-09's first-trade chart, lib/gann/firstTradeDates.ts).
# The file comes back as the `first-trade-dates-<run id>` artifact and is
# committed to lib/gann/firstTradeDates.json on the branch the run was started
# on, never main: start it on a feature branch and review the diff in the PR.
# A push that changes the script runs it too, on that branch.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [scripts/fetch-first-trade-dates.mjs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$CRON_SECRET" ] || exit 0
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          if [ "$(echo "$reply" | jq -r '.hold // false' 2>/dev/null)" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$(echo "$reply" | jq -r '.reason')"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch first-trade dates
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GSPS research 304179280+ymcctrading@users.noreply.github.com' }}
        run: node scripts/fetch-first-trade-dates.mjs --out out/firstTradeDates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-trade-dates-${{ github.run_id }}
          path: out/
      - name: Commit the file
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        run: |
          cp out/firstTradeDates.json lib/gann/firstTradeDates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/gann/firstTradeDates.json
          git diff --cached --quiet || git commit -m "First-trade dates from Wikidata and Yahoo (run ${{ github.run_id }}) (N/A)"
          git push

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
