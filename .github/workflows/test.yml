name: Tests

# Runs on pull requests, not on every branch push (owner,
# 2026-10-28: Actions minutes). A push to a branch with an open PR used to run
# this twice, once for each event, about 60% of the test minutes in the week
# measured. Every PR opened through the GitHub App API since has had its
# `pull_request` run scheduled, which was the reason branch pushes were added.
# A branch with no PR yet gets no run; each session runs the suite before it
# opens one.
#
# Two more skips, same reason: a draft PR runs nothing until it is marked
# ready, and a change to Markdown only (any `.md` file but the two public docs
# the banned-terms gate reads) runs nothing, since no test reads one. Not all
# of `docs/`: criteria-gate.test.ts reads the committed runs in
# docs/replay-runs/*.json.
#
# Since 2026-11-09 (option 3 of claude-usage/actions-minutes-breakdown.md, for
# a private repository's 2,000 free minutes a month): pull requests only, no
# run on a push to main. Every push to main is a release-train merge (or an
# urgent fix merged alone), and its release PR already ran this suite on the
# merge result, so a second run on main repeated it for about 6 minutes a
# merge. workflow_dispatch stays for a by-hand run of main. Budget and rules:
# docs/CI-MINUTES.md.
#
# Cheaper test job (2026-11-09, Actions minutes on the free plan). Measured on
# three runs that day, a job took 252-390 s, billed 5-7 minutes: npm ci 34-54,
# vitest 122-200, eslint 25-38, tsc 16-27, next build 35-56. So:
# - node_modules is cached on the lockfile's hash; npm ci runs only on a miss.
# - eslint's cache and tsc's incremental build info are cached (restored from
#   the newest run); both key on file content, never on timestamps. Warm,
#   locally: eslint 35 s -> 1 s, tsc 23 s -> 4 s.
# - On a feature PR, vitest runs only the tests related to the changed files
#   (its import graph) plus every test that reads a file from disk, since an
#   import graph can't see those (wiring and parity tests, the committed
#   replay runs). The full suite runs on release-train PRs (release/*), a
#   manual run, any PR that changes a file outside lib/, app/ and components/
#   TypeScript and JSON, or deletes or renames one. The train runs the full
#   suite on the merge result before anything reaches main, so a test the
#   narrower run misses is still caught there.
# - Non-Markdown files under docs/ are skipped too, except the three folders
#   tests read: docs/replay-runs, docs/research and docs/agents. AGENTS.md
#   runs the job, since agents-md-size.test.ts reads it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Later patterns override earlier ones (GitHub's `paths` filter).
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/replay-runs/**'
      - 'docs/research/**'
      - 'docs/agents/**'
      - 'README.md'
      - 'FEATURES.md'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    name: Unit tests

    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$CRON_SECRET" ]; then echo "::notice::Usage meter not configured (no CRON_SECRET), job not gated."; exit 0; fi
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          hold=$(echo "$reply" | jq -r 'if type == "object" and has("hold") then (.hold | tostring) else "" end' 2>/dev/null || true)
          reason=$(echo "$reply" | jq -r '.reason // ""' 2>/dev/null || true)
          if [ -z "$hold" ] || [ "${reason#Unread:}" != "$reason" ]; then
            echo "::warning::Usage meter unreadable, job not gated."
            exit 0
          fi
          if [ "$hold" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$reason"
            exit 1
          fi
      # Depth 2: on a pull request this is GitHub's merge commit and its first
      # parent (the base), enough to list the PR's changed files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore the lint and type-check caches
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: checks-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-

      - name: Choose the tests
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          full() { echo "mode=full" >> "$GITHUB_OUTPUT"; echo "::notice::Full suite: $1"; exit 0; }
          [ "$EVENT" = "pull_request" ] || full "not a pull request ($EVENT)"
          case "$HEAD_REF" in release/*) full "release-train PR";; esac
          git rev-parse -q --verify HEAD^2 >/dev/null || full "no merge commit to compare"
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          [ -n "$changed" ] || full "no changed files listed"
          git diff --name-only --no-renames --diff-filter=D HEAD^1 HEAD | grep -q . && full "a file was deleted or renamed"
          other=$(printf '%s\n' "$changed" | grep -vE '^(lib|app|components)/.+\.(ts|tsx|json)$' || true)
          [ -z "$other" ] || full "changes outside lib/, app/, components/ code: $(printf '%s' "$other" | head -3 | tr '\n' ' ')"
          disk=$(grep -rlE 'readFileSync|readdirSync|readFile\(|globSync|fs\.promises|existsSync' \
            --include='*.test.ts' --include='*.test.tsx' lib app components || true)
          echo "::notice::Related tests for $(printf '%s\n' "$changed" | wc -l) changed files, plus $(printf '%s\n' "$disk" | wc -l) tests that read from disk"
          { echo "mode=related"; echo "files<<FILES_EOF"; printf '%s\n' "$changed" "$disk"; echo "FILES_EOF"; } >> "$GITHUB_OUTPUT"

      # Covers lib/__tests__/user-copy.test.ts, which asserts that the strings
      # the scan builds at runtime — checklist criteria, pattern descriptions,
      # trade-level warnings and errors — stay in plain language. A static scan
      # cannot see those, so this job is the other half of the terminology gate.
      #
      - name: Tests
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          FILES: ${{ steps.scope.outputs.files }}
        run: |
          if [ "$MODE" = "related" ]; then
            # Word splitting is intended: one path per word, none has spaces.
            npx vitest related --run --passWithNoTests $FILES
          else
            npm test
          fi

      # Both of these were advisory until the pre-existing failures in
      # lib/learning/* and the broker clients were fixed. They are gates now;
      # `set-state-in-effect` remains a warning (see eslint.config.mjs) so the
      # chart-effect restructuring can be done as its own reviewable change.
      - run: npx eslint --cache --cache-strategy content --cache-location .eslintcache

      - run: npx tsc --noEmit

      # The production build was not a gate until now, which left a gap the
      # other three jobs cannot cover: a build can fail for reasons
      # `tsc --noEmit` never sees — a bad import boundary, a server-only module
      # pulled into a client component. This change also removes
      # `typescript: { ignoreBuildErrors: true }` from `next.config.ts`, so the
      # build re-checks types too; it stays the only step that catches a
      # build-only failure (a route that type-checks but fails to compile or
      # prerender) before it reaches Vercel, which builds on every push anyway.
      #
      # No secrets are configured for this step on purpose. The build must not
      # need them, and if it ever starts to, that is the finding.
      - run: npm run build

      # What the browser receives: identifiers and keys a client imports ship
      # in the bundle even when no copy shows them (AGENTS.md, "Confidential
      # sources"). Seconds, inside this job, so no extra minutes.
      - run: node scripts/check-bundle-terms.mjs

      # Prevents the collision documented in CHANGELOG.md: two migrations
      # sharing a numeric prefix, where apply order was ambiguous and one
      # was silently skipped in production. See scripts/check-migrations.mjs.
      - run: npm run check:migrations

      # The banned-terms gate, folded in from its own workflow (2026-10-28):
      # a second job paid for its own runner minute to run one script that
      # takes seconds. It needs no install, so it runs on what is here.
      - name: Check for banned terms
        run: node scripts/check-banned-terms.mjs

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled. The 30
      # seconds cover job setup and the post-job steps this clock can't see.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 30 + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
