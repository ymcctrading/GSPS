name: Autonomous Portfolio Manager

# Runs the Automated Portfolio Manager loop (lib/automation/portfolio-manager.ts,
# app/api/automation/portfolio-manager/run/route.ts) for every member with the
# "/automation" page's Portfolio Manager toggle switched on. Same reason this
# lives in GitHub Actions rather than vercel.json as premarket-scan.yml and
# demo-auto-trade.yml: the Vercel Hobby plan caps scheduled jobs at 2/project,
# and both slots are already spent on the daily market scan and the trade-
# journal email.
#
# Runs are idempotent and re-derive everything from the database each time
# (entitlement, plan eligibility, which plans are already automated), so a
# run with nothing new to do is a correct, cheap no-op — safe to run several
# times through the session rather than once a day.
#
# Every 15 minutes through the session (13:00-21:45 UTC covers 09:30-16:00 ET
# under both EST and EDT), one look per closed execution bar. Each run arms the
# plans that have confirmed on the closed bars since they were generated
# (lib/lifecycle/armFromBars.ts), then activates them. Four looks a day missed
# most plans: a plan's window is only a few session bars long.
on:
  # Scheduled from the database since 2026-10-21 (pg_cron, migration
  # 0089_scheduled_jobs_pg_cron.sql): GitHub dropped most scheduled runs.
  # Run by hand from the Actions tab if needed.
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    name: Trigger /api/automation/portfolio-manager/run
    steps:
      - name: Call portfolio manager run
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/automation/portfolio-manager/run")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "automation/portfolio-manager/run returned $status" >&2
            exit 1
          fi
