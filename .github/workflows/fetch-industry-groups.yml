name: Fetch industry groups (manual)

# Runs scripts/fetch-industry-groups.mjs, which reads each LARGE_CAP_UNIVERSE
# stock's SEC industry code (SIC) for the relative strength rank's group map
# (lib/gann/industryGroups.ts). The file comes back as the
# `industry-groups-<run id>` artifact and printed between BEGIN/END markers in
# the log. With the `commit` input set, it is also committed to
# lib/gann/industryGroups.json on the branch the run was started on (never
# main by default: start it on a feature branch and review the diff in the PR).
#
# SEC asks for a User-Agent with a contact email and refuses one without
# (HTTP 403). The SEC_USER_AGENT repository secret ("Name contact@example.com")
# is used when set; otherwise the repository owner's public GitHub noreply
# address.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the file to the branch the run was started on"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$CRON_SECRET" ]; then echo "::notice::Usage meter not configured (no CRON_SECRET), job not gated."; exit 0; fi
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          hold=$(echo "$reply" | jq -r 'if type == "object" and has("hold") then (.hold | tostring) else "" end' 2>/dev/null || true)
          reason=$(echo "$reply" | jq -r '.reason // ""' 2>/dev/null || true)
          if [ -z "$hold" ] || [ "${reason#Unread:}" != "$reason" ]; then
            echo "::warning::Usage meter unreadable, job not gated."
            exit 0
          fi
          if [ "$hold" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$reason"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch SIC codes
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GSPS research 304179280+ymcctrading@users.noreply.github.com' }}
        run: node scripts/fetch-industry-groups.mjs --out out/industryGroups.json
      - name: Print the file
        if: always()
        run: |
          echo "=== BEGIN industryGroups.json ==="
          cat out/industryGroups.json || true
          echo "=== END industryGroups.json ==="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-groups-${{ github.run_id }}
          path: out/
      - name: Commit the file
        if: inputs.commit && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        run: |
          cp out/industryGroups.json lib/gann/industryGroups.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/gann/industryGroups.json
          git diff --cached --quiet || git commit -m "Industry groups from SEC (run ${{ github.run_id }}) (N/A)"
          git push

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled. The 30
      # seconds cover job setup and the post-job steps this clock can't see.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 30 + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
