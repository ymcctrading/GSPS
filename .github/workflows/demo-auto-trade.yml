name: Demo profile auto-trade

# Trades the showcase demo profile automatically — see lib/demo/auto-trade.ts
# and app/api/demo/auto-trade/route.ts. Same reason this lives in GitHub
# Actions rather than vercel.json as premarket-scan.yml and intraday-scan.yml:
# the Vercel Hobby plan caps scheduled jobs at 2/project, and both slots are
# already spent on the daily market scan and the trade-journal email.
#
# Three runs on a trading day, not one: the route enforces its own daily/
# weekly caps and re-checks live prices on every call, so multiple runs are
# safe (a run with nothing new to do just tries a quiet-day DCA add and
# exits). The point of more than one run is that a "cadence" A/B day
# (lib/demo/auto-trade.ts's pickArm) allows a couple of extra trades over the
# normal daily cap, and those only have somewhere to come from if the job
# runs more than once while new setups can still arm during the session.
#
# 12:35 UTC: shortly after premarket-scan.yml (12:30 UTC) publishes the
# day's shortlist, so there's something to look at from the open.
# 17:00 UTC / 19:30 UTC: two more looks through the session, wide enough to
# tolerate GitHub Actions' looser cron timing under both EST and EDT.
on:
  # Scheduled from the database since 2026-10-21 (pg_cron: migration
  # 0089_scheduled_jobs_pg_cron.sql, with the times staggered by
  # 0097_stagger_scheduled_jobs.sql): GitHub dropped most scheduled runs. The
  # schedule notes above describe the cadence, which the database keeps. Run
  # by hand from the Actions tab if needed.
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    name: Trigger /api/demo/auto-trade
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$CRON_SECRET" ] || exit 0
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          if [ "$(echo "$reply" | jq -r '.hold // false' 2>/dev/null)" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$(echo "$reply" | jq -r '.reason')"
            exit 1
          fi
      - name: Call demo auto-trade
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/demo/auto-trade")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "demo/auto-trade returned $status" >&2
            exit 1
          fi

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
