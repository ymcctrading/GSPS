name: Research daily basket (wide-range study)

# Research only, this branch only: reads daily bars for the wide-range day
# study and commits them to the branch. Not part of the app; never merged.
on:
  push:
    branches: [claude/project-thread-37n2rc]
    paths: [.github/workflows/research-daily-basket.yml, scripts/research/fetch-daily-basket.mjs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SYMBOLS: "SPY,QQQ,TXN,AAPL,MSFT,NVDA,AMD,INTC,QCOM,ADI,MU,AVGO,ORCL,CRM,ADBE,NOW,IBM,CSCO,AMAT,LRCX,KLAC,MCHP,ON,GOOGL,META,NFLX,DIS,T,VZ,CMCSA,AMZN,TSLA,HD,MCD,NKE,SBUX,LOW,TGT,BKNG,F,GM,KO,PEP,PG,WMT,COST,CL,MO,KHC,GIS,JNJ,PFE,MRK,LLY,UNH,ABBV,AMGN,GILD,ISRG,VRTX,REGN,BIIB,JPM,BAC,GS,MS,WFC,C,SCHW,BLK,AXP,V,MA,CAT,DE,BA,GE,HON,UPS,UNP,LMT,RTX,MMM,FDX,XOM,CVX,COP,SLB,OXY,EOG,DVN,HAL,LIN,FCX,NEM,DOW,NUE,NEE,DUK,SO,D,AEP,AMT,PLD,O,SPG,EQIX,PLTR,COIN,MSTR,SMCI,CRWD,SNOW,UBER,SHOP,ROKU,ENPH,DXCM,ULTA,CMG,LULU,WYNN,MRNA"
        run: node scripts/research/fetch-daily-basket.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-data
          git commit -m "Research: daily basket bars (run ${{ github.run_id }}) (N/A)"
          git push
