name: Security

# Secret scanning and an audit of known-vulnerable packages. They catch a
# different class of problem than the Tests workflow does. One job since 2026-10-28 (owner: Actions minutes): as three jobs each
# paid for its own runner minute, and npm audit reads the lockfile, so it
# needs no install.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    name: Security checks
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$CRON_SECRET" ] || exit 0
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          if [ "$(echo "$reply" | jq -r '.hold // false' 2>/dev/null)" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$(echo "$reply" | jq -r '.reason')"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks CLI, not gitleaks/gitleaks-action: the action needs a paid
      # GITLEAKS_LICENSE on a private repository, and the repo went private on
      # 2026-10-28. The CLI is MIT-licensed and free. It scans the commits a PR
      # adds (base..head), or the commits a push to main adds, as the action
      # did. Dependency review (actions/dependency-review-action) was dropped
      # the same day: on a private repository it needs GitHub Advanced
      # Security, which is paid. npm audit below still reports known
      # vulnerabilities in the lockfile.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.18.4
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${HEAD}"
          else
            range="${HEAD}~1..${HEAD}"
          fi
          echo "Scanning ${range}"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="${range}" --redact --verbose --exit-code 1

      # Informational for now. As of 2026-10-21 (review finding CI-1) the
      # in-range fixes are applied and axios is pinned to 1.20.0 through
      # `overrides` (snaptrade-typescript-sdk pins an affected 1.16.1). The one
      # high finding left is `braces`, which has no patched release; it is
      # reached only at build time, through @sentry/nextjs 8's webpack plugin
      # (chokidar) and eslint-config-next (micromatch), never on a request.
      # Clearing it means a major Sentry upgrade, its own reviewable change.
      # `continue-on-error` keeps it visible without blocking merges.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
          # Only main builds on Vercel, so a push to main is one deployment.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
              -d "{\"meter\":\"vercel_deployments\",\"units\":1,\"key\":\"deploy-${{ github.sha }}\"}" "$USAGE_URL" || true
          fi
