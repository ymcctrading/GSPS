name: Security

# Secret scanning, dependency review and an audit of known-vulnerable
# packages. They catch a different class of problem than the Tests workflow
# does. One job since 2026-10-28 (owner: Actions minutes): as three jobs each
# paid for its own runner minute, and npm audit reads the lockfile, so it
# needs no install.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    name: Security checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only on PRs: it diffs the base ref against the head ref, so it has
      # nothing to compare on a plain push.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Informational for now. As of 2026-10-21 (review finding CI-1) the
      # in-range fixes are applied and axios is pinned to 1.20.0 through
      # `overrides` (snaptrade-typescript-sdk pins an affected 1.16.1). The one
      # high finding left is `braces`, which has no patched release; it is
      # reached only at build time, through @sentry/nextjs 8's webpack plugin
      # (chokidar) and eslint-config-next (micromatch), never on a request.
      # Clearing it means a major Sentry upgrade, its own reviewable change.
      # `continue-on-error` keeps it visible without blocking merges.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
