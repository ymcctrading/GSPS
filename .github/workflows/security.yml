name: Security

# None of this existed before: no secret scanning, no dependency review, no
# audit of known-vulnerable packages. All three are cheap and catch a
# different class of problem than the Tests workflow does.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Secret scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    # Only runs on PRs — it diffs the base ref against the head ref, so it
    # has nothing to compare on a plain push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Dependency review
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    runs-on: ubuntu-latest
    name: npm audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Informational for now. As of 2026-10-21 (review finding CI-1) the
      # in-range fixes are applied and axios is pinned to 1.20.0 through
      # `overrides` (snaptrade-typescript-sdk pins an affected 1.16.1). The one
      # high finding left is `braces`, which has no patched release; it is
      # reached only at build time, through @sentry/nextjs 8's webpack plugin
      # (chokidar) and eslint-config-next (micromatch), never on a request.
      # Clearing it means a major Sentry upgrade, its own reviewable change.
      # `continue-on-error` keeps it visible without blocking merges.
      - run: npm audit --audit-level=high
        continue-on-error: true
