name: Morning Preparation scan

# The 6:30 AM ET "Morning Preparation" scheduled scan from
# GSPS_TIER_ENTITLEMENT_SPEC.md. Both Vercel cron slots are already spent
# (/api/market-scan at 20:00 ET, /api/trade-journal/daily-email at 18:00 ET
# -- see docs/THIRD_PARTY_LIMITS.md), so this follows the same
# GitHub-Actions-external-scheduler pattern as premarket-scan.yml rather than
# vercel.json.
#
# 10:30 UTC = 6:30 AM ET during EDT (UTC-4, roughly mid-March to early
# November). During EST (UTC-5) this actually fires at 5:30 AM ET -- the same
# DST drift premarket-scan.yml already accepts for its own fixed-UTC
# schedule, for the same reason: the route's output doesn't depend on being
# called at exactly its nominal minute. Revisit if that stops being true.
#
# Moved from 6:00 AM to 6:30 AM ET, 2026-09-23, project-owner direction: give
# a user a little more real time between this run and the 8:30 AM premarket
# scan to react to pre-market moves.
#
# lib/entitlements/scheduled-scan.ts runs this at the full big-cap universe
# budget (FULL_UNIVERSE_TOP in lib/marketScan.ts) -- see that file's header
# comment for the current budget and when to reintroduce a reduced one.
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trigger /api/scans/morning-preparation
    steps:
      - name: Call morning-preparation scan
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/scans/morning-preparation")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "morning-preparation scan returned $status" >&2
            exit 1
          fi
