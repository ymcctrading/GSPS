name: Afternoon scan

# The ~2:00 PM ET scheduled scan from app/api/scans/afternoon's header
# comment -- added alongside midday-scan.yml to close the coverage gap
# between the 9:45 AM first-90min scan and the 5:30 PM post-close run. Both
# Vercel cron slots are already spent (see docs/THIRD_PARTY_LIMITS.md), so
# this follows the same GitHub-Actions pattern as premarket-scan.yml and the
# other scheduled-scan workflows rather than vercel.json.
#
# 18:00 UTC = 2:00 PM ET during EDT (UTC-4, roughly mid-March to early
# November). During EST (UTC-5) this actually fires at 1:00 PM ET -- the
# same DST drift every other fixed-UTC scheduled-scan workflow in this repo
# already accepts, for the same reason: the route's output doesn't depend
# on being called at exactly its nominal minute.
on:
  # Scheduled from the database since 2026-10-21 (pg_cron: migration
  # 0089_scheduled_jobs_pg_cron.sql, with the times staggered by
  # 0097_stagger_scheduled_jobs.sql): GitHub dropped most scheduled runs. The
  # schedule notes above describe the cadence, which the database keeps. Run
  # by hand from the Actions tab if needed.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trigger /api/scans/afternoon
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$CRON_SECRET" ]; then echo "::notice::Usage meter not configured (no CRON_SECRET), job not gated."; exit 0; fi
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          hold=$(echo "$reply" | jq -r 'if type == "object" and has("hold") then (.hold | tostring) else "" end' 2>/dev/null || true)
          reason=$(echo "$reply" | jq -r '.reason // ""' 2>/dev/null || true)
          if [ -z "$hold" ] || [ "${reason#Unread:}" != "$reason" ]; then
            echo "::warning::Usage meter unreadable, job not gated."
            exit 0
          fi
          if [ "$hold" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$reason"
            exit 1
          fi
      - name: Call afternoon scan
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/scans/afternoon")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "afternoon scan returned $status" >&2
            exit 1
          fi

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled. The 30
      # seconds cover job setup and the post-job steps this clock can't see.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 30 + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
