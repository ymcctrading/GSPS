name: Monitor invalidation sweep

# Twice an hour, market hours only, per project owner direction
# (2026-09-17): a cheap live stop-check against every open active_monitors
# row (WATCH/EXECUTE, across every profile), so a tracked setup that already
# broke its stop drops off the dashboard well before the next full
# scheduled scan happens to rescan that exact symbol. See
# app/api/monitors/invalidation-sweep/route.ts's header for what this does
# and, just as importantly, what it does NOT do -- it is one live price
# fetch per distinct tracked symbol, never a full universe rescan.
#
# `:15` and `:45` past the hour, the "15 & 45 mark of every hour" option the
# project owner offered. `13-21 UTC` is wider than the actual 09:30-16:00 ET
# session on purpose -- same reasoning as intraday-scan.yml's equity-hours
# schedule: it has to cover the session under both EST (UTC-5) and EDT
# (UTC-4) without a DST-aware cron, and GitHub Actions' scheduler is
# routinely a few minutes late anyway. A run that lands before the open or
# after the close is cheap and safe: the route just finds nothing to
# invalidate outside real trading hours' price moves, or is skipped
# entirely on a non-trading day (see the route's own isTradingDay check).
#
# Both Vercel cron slots are already spent (see docs/THIRD_PARTY_LIMITS.md),
# so this follows the same GitHub-Actions-external-scheduler pattern as
# intraday-scan.yml rather than vercel.json.
on:
  # Scheduled from the database since 2026-10-21 (pg_cron: migration
  # 0089_scheduled_jobs_pg_cron.sql, with the times staggered by
  # 0097_stagger_scheduled_jobs.sql): GitHub dropped most scheduled runs. The
  # schedule notes above describe the cadence, which the database keeps. Run
  # by hand from the Actions tab if needed.
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    name: Trigger /api/monitors/invalidation-sweep
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$CRON_SECRET" ] || exit 0
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          if [ "$(echo "$reply" | jq -r '.hold // false' 2>/dev/null)" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$(echo "$reply" | jq -r '.reason')"
            exit 1
          fi
      - name: Call invalidation sweep
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/monitors/invalidation-sweep")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "invalidation sweep returned $status" >&2
            exit 1
          fi

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
