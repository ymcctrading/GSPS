name: Intraday scan

# The coverage gap that let a real move go unnoticed: /api/intraday-scan was
# "on demand" only — driven by a signed-in user's browser while the Scanner
# page happened to be open (see the route's own header comment). Nobody has
# to be watching for this to run now. Same workaround as premarket-scan.yml:
# Vercel Hobby caps scheduled jobs at 2/project, 1 run/day each, and both
# slots are spent on the daily market scan — so a job that needs to run every
# few minutes during the session has to live outside vercel.json entirely.
#
# The database (pg_cron) now runs it every 15 minutes: `13-21 UTC` on
# weekdays covers the 09:30-16:00 ET session under both EST and EDT, and the
# hours outside it (weekday overnight and the whole weekend) are scanned with
# `?universe=crypto`, since crypto is the only part of the watchlist still
# trading then (2026-08-21: a live BTC move went unflagged because nothing
# scanned crypto at any hour). A run that lands before the open or after the
# close is cheap: the route reports it as pre-market/after-hours and scans the
# last closed session's data rather than fabricating anything.
#
# A manual run scans the full watchlist, or only the crypto symbols when the
# `universe` input is set to `crypto`.
#
# Authorized the same way as /api/market-scan: CRON_SECRET as a bearer token.
# The route only fans out email notifications and writes to
# intraday_system_alerts on this authorized path — a signed-in user's own
# on-demand scan (still served the same way it always was) never emails
# anyone on their behalf.
on:
  # Scheduled from the database since 2026-10-21 (pg_cron: migration
  # 0089_scheduled_jobs_pg_cron.sql, with the times staggered by
  # 0097_stagger_scheduled_jobs.sql): GitHub dropped most scheduled runs. The
  # schedule notes above describe the cadence, which the database keeps. Run
  # by hand from the Actions tab if needed.
  workflow_dispatch:
    inputs:
      universe:
        description: "Which symbols to scan"
        type: choice
        options: [all, crypto]
        default: all

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Trigger /api/intraday-scan
    steps:
      # Free-tier usage meter (AGENTS.md, "Usage limits"): refuses the job at
      # 99% of the month's Actions minutes, unless the PR carries the
      # usage-override label (only on the owner's OK) or it is the month's last
      # two days. Fails open when the meter can't be reached.
      - name: Usage gate
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'usage-override') }}
        run: |
          echo "USAGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$CRON_SECRET" ] || exit 0
          reply=$(curl -sS -m 10 -H "Authorization: Bearer $CRON_SECRET" "$USAGE_URL?gate=github_actions" || true)
          if [ "$(echo "$reply" | jq -r '.hold // false' 2>/dev/null)" = "true" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::$(echo "$reply" | jq -r '.reason')"
            exit 1
          fi
      - name: Call intraday-scan
        run: |
          query=""
          if [ "${{ inputs.universe }}" = "crypto" ]; then
            query="?universe=crypto"
          fi
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/intraday-scan${query}")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "intraday-scan returned $status" >&2
            exit 1
          fi

      # Reports this job's billed minutes (rounded up, at least one) to the
      # usage meter. Runs even when the job failed or was cancelled.
      - name: Usage report
        if: always()
        env:
          USAGE_URL: ${{ vars.PRODUCTION_URL || 'https://gsps.vercel.app' }}/api/ops/usage
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          start=${USAGE_JOB_START:-$(date +%s)}
          minutes=$(( ($(date +%s) - start + 59) / 60 )); [ "$minutes" -ge 1 ] || minutes=1
          curl -sS -m 10 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d "{\"meter\":\"github_actions\",\"units\":$minutes,\"key\":\"job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}\",\"detail\":{\"workflow\":\"${{ github.workflow }}\",\"event\":\"${{ github.event_name }}\"}}" "$USAGE_URL" || true
